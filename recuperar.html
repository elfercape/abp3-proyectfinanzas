<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - FinanzApp</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="page-recovery bg-light">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
      <div class="card-app p-4 text-center shadow" style="max-width: 450px">
        <h3 class="mb-4">Restablecer Contraseña</h3>
        <p class="mb-4">
          Se le enviará una contraseña de restauración a su correo electrónico institucional.
        </p>
        <div class="form-group">
          <input type="email" class="form-control" placeholder="usuario@correo.com" />
        </div>
        <button
          onclick="alert('Se ha enviado una contraseña de restauración a su correo electrónico.')"
          class="btn-app btn-app--primary btn-app--block"
        >
          Enviar Instrucciones
        </button>
        <a href="index.html" class="d-block mt-3 text-secondary">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
